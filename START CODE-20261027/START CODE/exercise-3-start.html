<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            padding:1rem;
            background:#f5f5f5;
        }

        .container{
            display:flex;
            flex-direction:column;
            height:100vh;
            gap:1rem;
        }

        header{
            background:#1e90ff;
            box-shadow:0 4px 8px #0077ea;
            border-radius:0.5rem;
            padding:1rem;
            color:white;
        }

        .content{
            display:flex;
            gap:1rem;
            flex-grow:1;
        }

        main{
            background:#3cb371;
            box-shadow:0 4px 8px #2f8d59;
            border-radius:0.5rem;
            padding:1rem;

            display:flex;
            flex-wrap:wrap;
            gap:1rem;
            
        }

        .item{
            background:#2f8d59;
            box-shadow:0 4px 8px #226741;
            border-radius:0.5rem;
            color:white;

            width:80px;
            height:50px;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        aside{
            background:#ff6347;
            box-shadow:0 4px 8px #e02200;
            border-radius:0.5rem;
            padding:1rem;
            width:120px;
            color:white;
        }

        footer{
            background:#4169e1;
            box-shadow:0 4px 8px #1d44b8;
            border-radius:0.5rem;
            padding:1rem;
            color:white;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>header</header>

        <div class="content">

            <main>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </main>

            <aside>sidebar</aside>

        </div>

        <footer>footer</footer>

    </div>

</body>
</html>
