<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      padding-left: 160px;
      padding-right: 160px;
      background: pink;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      
      background: greenyellow;
      gap: 20px;
    }

    header, footer {
      background: grey;
      height: 100px;
    }

    main {
      background: grey;
      flex-grow: 1;
    }

    
  </style>
</head>
<body>
  <div class="container">
    <header>Header</header>
    <main>Main</main>
    <footer>Footer</footer>
  </div>
</body>
</html>
