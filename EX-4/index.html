<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <header>
            <section class="profile">
                <img class="pfp" src="./photo_2026-11-03_13-48-41.jpg" alt="profile_picture">
                <h2>Lam Chikheang</h2>
                <h4>Data Science @ CADT</h4>
            </section>
        </header>

        <section class="info">
            <div class="box">Projects <span style="font-weight: bold; font-size: 16px;">17</span></div>
            <div class="box">Following <span style="font-weight: bold; font-size: 16px;">159</span></div>
            <div class="box">Followers <span style="font-weight: bold; font-size: 16px;">205</span></div>
        </section>

        <section class="bio">
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ullam et similique fuga velit impedit modi deserunt voluptatum doloribus quae.</p>
        </section>

        <section class="link">
            <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="X">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
            <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn">
        </section>

        <section class="view">
            <button class="btn">View Profile</button>
        </section>
    </div>

</body>
</html>
